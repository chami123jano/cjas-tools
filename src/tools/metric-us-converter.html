<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metric to US Converter — Cja's Tools</title>
<meta name="description" content="Quick everyday conversions between metric and US units for cooking, distance, weight and temperature. Free and works offline.">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .pair {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px;
    align-items: end; margin-bottom: 14px;
  }
  .pair .arrow { padding-bottom: 10px; color: var(--muted); font-size: 17px; }
  .ref { width: 100%; border-collapse: collapse; font-size: 14px; }
  .ref th, .ref td { padding: 8px 4px; text-align: left; }
  .ref td:last-child, .ref th:last-child { text-align: right; }
  .ref thead th {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--muted); border-bottom: 1px solid var(--border);
  }
  .ref tbody tr { border-bottom: 1px solid var(--border); }
  .ref tbody tr:last-child { border-bottom: none; }
  @media (max-width: 480px) { .pair { grid-template-columns: 1fr; } .pair .arrow { display: none; } }
</style>
</head>
<body data-page="tool" data-slug="metric-us-converter">

  <div class="shell">
    <main>
      <div class="crumb">
        <a href="../index.html">All tools</a> &rsaquo;
        <a href="../index.html?cat=converters">Converters</a>
      </div>

      <div class="tool-head">
        <h1>Metric to US Converter</h1>
        <p>For recipes and American measurements. Type in either box.</p>
      </div>

      <div class="panel">
        <div class="field">
          <label for="topic">What are you converting?</label>
          <select id="topic">
            <option value="cooking">Cooking volume</option>
            <option value="weight">Cooking weight</option>
            <option value="oven">Oven temperature</option>
            <option value="distance">Distance</option>
            <option value="body">Body weight and height</option>
          </select>
        </div>
      </div>

      <div class="panel" id="pairs"></div>

      <div class="panel">
        <label style="margin-bottom:10px" id="ref-title">Quick reference</label>
        <table class="ref">
          <thead><tr><th id="ref-a">Metric</th><th id="ref-b">US</th></tr></thead>
          <tbody id="ref-body"></tbody>
        </table>
        <p class="hint">US cups are 240 ml. A UK or Australian cup is 250 ml, so an
          American recipe measured in an Australian cup comes out about 4% over.</p>
      </div>
    </main>
  </div>

  <script src="../assets/tools.js"></script>
  <script src="../assets/app.js"></script>
  <script>
  (function () {
    /* Each pair is metric unit, US unit, and how many metric units make
       one US unit. Temperature is not a simple multiple, so it is flagged. */
    var TOPICS = {
      cooking: {
        title: 'Cooking volume',
        pairs: [
          ['Millilitres', 'US teaspoons', 4.92892159375],
          ['Millilitres', 'US tablespoons', 14.78676478125],
          ['Millilitres', 'US cups', 236.5882365],
          ['Litres', 'US pints', 0.473176473],
          ['Litres', 'US quarts', 0.946352946],
          ['Litres', 'US gallons', 3.785411784]
        ],
        reference: [
          ['1/4 teaspoon', '1.25 ml'], ['1 teaspoon', '5 ml'],
          ['1 tablespoon', '15 ml'], ['1/4 cup', '60 ml'],
          ['1/3 cup', '79 ml'], ['1/2 cup', '118 ml'],
          ['1 cup', '237 ml'], ['1 pint', '473 ml'], ['1 gallon', '3.79 litres']
        ],
        refHead: ['US measure', 'Metric']
      },
      weight: {
        title: 'Cooking weight',
        pairs: [
          ['Grams', 'Ounces', 28.349523125],
          ['Grams', 'Pounds', 453.59237],
          ['Kilograms', 'Pounds', 0.45359237]
        ],
        reference: [
          ['1 oz', '28 g'], ['4 oz', '113 g'], ['8 oz (1/2 lb)', '227 g'],
          ['1 lb', '454 g'], ['2 lb', '907 g'],
          ['1 cup flour', 'about 120 g'], ['1 cup sugar', 'about 200 g'],
          ['1 cup butter', 'about 227 g']
        ],
        refHead: ['US measure', 'Metric']
      },
      oven: {
        title: 'Oven temperature',
        temperature: true,
        reference: [
          ['Very slow', '120 C / 250 F / gas 1'],
          ['Slow', '150 C / 300 F / gas 2'],
          ['Moderate', '180 C / 350 F / gas 4'],
          ['Moderately hot', '200 C / 400 F / gas 6'],
          ['Hot', '220 C / 425 F / gas 7'],
          ['Very hot', '240 C / 475 F / gas 9']
        ],
        refHead: ['Description', 'Setting']
      },
      distance: {
        title: 'Distance',
        pairs: [
          ['Centimetres', 'Inches', 2.54],
          ['Metres', 'Feet', 0.3048],
          ['Metres', 'Yards', 0.9144],
          ['Kilometres', 'Miles', 1.609344]
        ],
        reference: [
          ['1 inch', '2.54 cm'], ['1 foot', '30.48 cm'], ['1 yard', '0.91 m'],
          ['1 mile', '1.61 km'], ['5 km', '3.11 miles'], ['10 km', '6.21 miles'],
          ['42.2 km (marathon)', '26.2 miles']
        ],
        refHead: ['US measure', 'Metric']
      },
      body: {
        title: 'Body weight and height',
        pairs: [
          ['Kilograms', 'Pounds', 0.45359237],
          ['Kilograms', 'Stone', 6.35029318],
          ['Centimetres', 'Inches', 2.54],
          ['Centimetres', 'Feet', 30.48]
        ],
        reference: [
          ['5 ft 0 in', '152 cm'], ['5 ft 4 in', '163 cm'], ['5 ft 8 in', '173 cm'],
          ['6 ft 0 in', '183 cm'], ['100 lb', '45.4 kg'], ['150 lb', '68.0 kg'],
          ['200 lb', '90.7 kg']
        ],
        refHead: ['US measure', 'Metric']
      }
    };

    function topic() { return TOPICS[document.getElementById('topic').value]; }

    function round(v) {
      var a = Math.abs(v);
      var places = a === 0 ? 0 : a < 0.01 ? 5 : a < 1 ? 4 : a < 100 ? 3 : 2;
      return parseFloat(v.toFixed(places)).toLocaleString('en-US');
    }

    function drawPairs() {
      var t = topic();
      var host = document.getElementById('pairs');

      if (t.temperature) {
        host.innerHTML =
          '<div class="pair">' +
            '<div class="field"><label for="c">Celsius</label>' +
              '<input type="number" id="c" value="180" step="any"></div>' +
            '<div class="arrow">&harr;</div>' +
            '<div class="field"><label for="f">Fahrenheit</label>' +
              '<input type="number" id="f" value="356" step="any"></div>' +
          '</div>' +
          '<p class="hint">Fahrenheit = Celsius &times; 9/5 + 32. Ovens are usually ' +
          'rounded to the nearest 5 or 25 degrees, so use the nearest setting.</p>';

        var c = document.getElementById('c'), f = document.getElementById('f');
        c.addEventListener('input', function () {
          var v = parseFloat(c.value);
          f.value = isFinite(v) ? parseFloat((v * 9 / 5 + 32).toFixed(2)) : '';
        });
        f.addEventListener('input', function () {
          var v = parseFloat(f.value);
          c.value = isFinite(v) ? parseFloat(((v - 32) * 5 / 9).toFixed(2)) : '';
        });
        return;
      }

      host.innerHTML = t.pairs.map(function (p, i) {
        return '<div class="pair">' +
          '<div class="field"><label>' + p[0] + '</label>' +
            '<input type="number" data-i="' + i + '" data-side="m" step="any" value="' +
            round(p[2]) + '"></div>' +
          '<div class="arrow">&harr;</div>' +
          '<div class="field"><label>' + p[1] + '</label>' +
            '<input type="number" data-i="' + i + '" data-side="u" step="any" value="1"></div>' +
        '</div>';
      }).join('');

    }

    /* Attached once, to the container that survives every redraw. Binding
       it inside drawPairs would stack up a new listener each time the
       topic changed, and the older ones would still hold the old table. */
    document.getElementById('pairs').addEventListener('input', function (e) {
      var el = e.target;
      if (el.dataset.i === undefined) return;
      var t = topic();
      if (!t.pairs) return;
      var p = t.pairs[+el.dataset.i];
      var v = parseFloat(el.value);
      var other = this.querySelector('[data-i="' + el.dataset.i + '"][data-side="' +
                                     (el.dataset.side === 'm' ? 'u' : 'm') + '"]');
      if (!other) return;
      if (!isFinite(v)) { other.value = ''; return; }
      other.value = el.dataset.side === 'm'
        ? parseFloat((v / p[2]).toPrecision(8))
        : parseFloat((v * p[2]).toPrecision(8));
    });

    function drawReference() {
      var t = topic();
      document.getElementById('ref-title').textContent = t.title + ' — quick reference';
      document.getElementById('ref-a').textContent = t.refHead[0];
      document.getElementById('ref-b').textContent = t.refHead[1];
      document.getElementById('ref-body').innerHTML = t.reference.map(function (r) {
        return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>';
      }).join('');
    }

    document.getElementById('topic').addEventListener('change', function () {
      drawPairs();
      drawReference();
    });

    drawPairs();
    drawReference();
  })();
  </script>
</body>
</html>
