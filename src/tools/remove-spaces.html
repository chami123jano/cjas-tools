<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remove Extra Spaces — Cja's Tools</title>
<meta name="description" content="Tidy up double spaces, trailing spaces, blank lines, tabs and invisible characters pasted from the web. Free and works offline.">
<link rel="stylesheet" href="../assets/app.css">
<style>#in, #out { font-size: 14px; }</style>
</head>
<body data-page="tool" data-slug="remove-spaces">

  <div class="shell">
    <main>
      <div class="crumb">
        <a href="../index.html">All tools</a> &rsaquo;
        <a href="../index.html?cat=text">Text</a>
      </div>

      <div class="tool-head">
        <h1>Remove Extra Spaces</h1>
        <p>Clean up text pasted out of a PDF, an email or a web page.</p>
      </div>

      <div class="panel">
        <div class="field">
          <label for="in">Your text</label>
          <textarea id="in" spellcheck="false"></textarea>
        </div>
        <div class="btns">
          <button class="btn" id="clear">Clear</button>
        </div>
      </div>

      <div class="panel">
        <label style="margin-bottom:8px">What to tidy</label>
        <div class="btns" id="opts">
          <button class="btn primary" data-opt="collapse">Double spaces &rarr; one</button>
          <button class="btn primary" data-opt="trimLines">Spaces at line ends</button>
          <button class="btn primary" data-opt="tabs">Tabs &rarr; spaces</button>
          <button class="btn primary" data-opt="invisible">Invisible characters</button>
          <button class="btn" data-opt="blankLines">Repeated blank lines</button>
          <button class="btn" data-opt="allBlank">All blank lines</button>
          <button class="btn" data-opt="allSpaces">Every space</button>
          <button class="btn" data-opt="lineBreaks">Join into one line</button>
        </div>
      </div>

      <div class="panel">
        <div class="stats">
          <div class="stat"><b id="s-before">0</b><span>Characters before</span></div>
          <div class="stat"><b id="s-after">0</b><span>After</span></div>
          <div class="stat"><b id="s-saved">0</b><span>Removed</span></div>
        </div>
        <p class="hint" id="found"></p>
      </div>

      <div class="panel">
        <div class="field">
          <label for="out">Result</label>
          <textarea id="out" readonly spellcheck="false"></textarea>
        </div>
        <div class="btns">
          <button class="btn primary" id="copy">Copy result</button>
          <button class="btn" id="apply">Use as input</button>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/tools.js"></script>
  <script src="../assets/app.js"></script>
  <script>
  (function () {
    var opts = {
      collapse: true, trimLines: true, tabs: true, invisible: true,
      blankLines: false, allBlank: false, allSpaces: false, lineBreaks: false
    };

    var input = document.getElementById('in');
    var output = document.getElementById('out');

    /* The characters that actually cause trouble: non-breaking and exotic
       spaces, zero-width marks, and the byte-order mark. They look like
       nothing but break searching, sorting and comparisons.

       These are built from code points at runtime rather than written into
       a regex literal. U+2028 and U+2029 are line terminators as far as the
       JavaScript parser is concerned, so a literal one sitting in the source
       would split the line in half and stop the file parsing at all. */
    function classOf(codes) {
      return new RegExp('[' + codes.map(function (c) {
        return '\\u' + c.toString(16).toUpperCase().padStart(4, '0');
      }).join('') + ']', 'g');
    }

    /* Spaces of various widths - these become an ordinary space, so words
       do not get glued together. */
    var SPACEY = [0x00A0, 0x1680, 0x180E, 0x2000, 0x2001, 0x2002, 0x2003,
                  0x2004, 0x2005, 0x2006, 0x2007, 0x2008, 0x2009, 0x200A,
                  0x202F, 0x205F, 0x3000];
    /* Truly invisible - these are removed outright. */
    var ZERO_WIDTH = [0x200B, 0x200C, 0x200D, 0x2060, 0xFEFF];
    /* Line and paragraph separators - these become a newline. */
    var LINE_SEP = [0x2028, 0x2029];

    var RE_SPACEY = classOf(SPACEY);
    var RE_ZERO = classOf(ZERO_WIDTH);
    var RE_LINESEP = classOf(LINE_SEP);
    var INVISIBLE = classOf(SPACEY.concat(ZERO_WIDTH, LINE_SEP));

    function run() {
      var text = input.value;
      var before = text.length;
      var found = [];

      var invisibleCount = (text.match(INVISIBLE) || []).length;

      if (opts.invisible) {
        RE_SPACEY.lastIndex = 0;
        RE_ZERO.lastIndex = 0;
        RE_LINESEP.lastIndex = 0;
        text = text.replace(RE_SPACEY, ' ')
                   .replace(RE_ZERO, '')
                   .replace(RE_LINESEP, '\n');
      }
      if (opts.tabs) text = text.replace(/\t/g, ' ');
      if (opts.collapse) text = text.replace(/ {2,}/g, ' ');
      if (opts.trimLines) {
        text = text.split('\n').map(function (l) { return l.replace(/[ \t]+$/, ''); }).join('\n');
      }
      if (opts.allBlank) {
        text = text.split('\n').filter(function (l) { return l.trim() !== ''; }).join('\n');
      } else if (opts.blankLines) {
        text = text.replace(/\n{3,}/g, '\n\n');
      }
      if (opts.lineBreaks) text = text.replace(/\s*\n\s*/g, ' ').trim();
      if (opts.allSpaces) text = text.replace(/[ \t]/g, '');

      output.value = text;

      var after = text.length;
      document.getElementById('s-before').textContent = before.toLocaleString();
      document.getElementById('s-after').textContent = after.toLocaleString();
      document.getElementById('s-saved').textContent =
        Math.max(0, before - after).toLocaleString();

      if (invisibleCount) {
        found.push(invisibleCount + ' invisible character' +
          (invisibleCount === 1 ? '' : 's') +
          (opts.invisible ? ' found and dealt with' :
           ' found — turn on "Invisible characters" to clean them'));
      }
      document.getElementById('found').textContent = found.join('. ');
    }

    document.getElementById('opts').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-opt]');
      if (!btn) return;
      var k = btn.dataset.opt;
      opts[k] = !opts[k];
      btn.classList.toggle('primary', opts[k]);

      /* Removing all blank lines makes collapsing repeated ones pointless,
         so the weaker option switches itself off to avoid confusion. */
      if (k === 'allBlank' && opts.allBlank && opts.blankLines) {
        opts.blankLines = false;
        document.querySelector('[data-opt="blankLines"]').classList.remove('primary');
      }
      run();
    });

    input.addEventListener('input', run);

    document.getElementById('clear').addEventListener('click', function () {
      input.value = '';
      run();
      input.focus();
    });

    document.getElementById('copy').addEventListener('click', function () {
      if (!output.value) { CT.toast('Nothing to copy'); return; }
      CT.copy(output.value);
    });

    document.getElementById('apply').addEventListener('click', function () {
      input.value = output.value;
      run();
    });

    run();
  })();
  </script>
</body>
</html>
