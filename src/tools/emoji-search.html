<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emoji Search — Cja's Tools</title>
<meta name="description" content="Find an emoji by name or feeling and copy it with one click. Works offline.">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .egrid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px;
  }
  .ebtn {
    aspect-ratio: 1; border: 1px solid transparent; border-radius: 10px;
    background: none; cursor: pointer; font-size: 27px; line-height: 1;
    display: grid; place-items: center; padding: 0;
  }
  .ebtn:hover { background: var(--surface-2); border-color: var(--border); }
  .egroup { margin-bottom: 22px; }
  .egroup h3 {
    margin: 0 0 9px; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--muted); font-weight: 700;
  }
  .recent { min-height: 44px; }
</style>
</head>
<body data-page="tool" data-slug="emoji-search">

  <div class="shell">
    <main>
      <div class="crumb">
        <a href="../index.html">All tools</a> &rsaquo;
        <a href="../index.html?cat=text">Text</a>
      </div>

      <div class="tool-head">
        <h1>Emoji Search</h1>
        <p>Search by name or by what you mean. Click to copy.</p>
      </div>

      <div class="panel">
        <div class="field">
          <label for="q">Search</label>
          <input type="text" id="q" placeholder="happy, money, food, rain&hellip;"
                 autocomplete="off" spellcheck="false">
        </div>
        <p class="hint" id="count"></p>
      </div>

      <div class="panel" id="recent-panel" hidden>
        <h3 style="margin:0 0 9px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">Recently copied</h3>
        <div class="egrid recent" id="recent"></div>
      </div>

      <div class="panel" id="results"></div>
    </main>
  </div>

  <script src="../assets/tools.js"></script>
  <script src="../assets/app.js"></script>

    var RECENT_KEY = 'cja-emoji-recent';
    var q = document.getElementById('q');
    var results = document.getElementById('results');
    var count = document.getElementById('count');

    function readRecent() {
      try {
        var raw = localStorage.getItem(RECENT_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) { return []; }
    }

    function pushRecent(e) {
      var list = readRecent().filter(function (x) { return x !== e; });
      list.unshift(e);
      list = list.slice(0, 16);
      try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch (err) {}
      drawRecent();
    }

    function btn(e, words) {
      return '<button class="ebtn" data-e="' + e + '" title="' + words + '">' + e + '</button>';
    }

    function drawRecent() {
      var list = readRecent();
      document.getElementById('recent-panel').hidden = list.length === 0;
      document.getElementById('recent').innerHTML =
        list.map(function (e) { return btn(e, 'recently copied'); }).join('');
    }

    function search() {
      var term = q.value.trim().toLowerCase();
      var html = '';
      var total = 0;

      Object.keys(EMOJI).forEach(function (group) {
        var items = EMOJI[group].filter(function (row) {
          return !term || row[1].indexOf(term) !== -1;
        });
        if (!items.length) return;
        total += items.length;
        html += '<div class="egroup"><h3>' + group + '</h3><div class="egrid">' +
          items.map(function (r) { return btn(r[0], r[1]); }).join('') +
          '</div></div>';
      });

      if (!total) {
        results.innerHTML = '<p class="hint" style="margin:0">Nothing matches "' +
          q.value.trim() + '". Try a simpler word like happy, food or money.</p>';
        count.textContent = '';
        return;
      }

      results.innerHTML = html;
      count.textContent = term
        ? total + ' emoji match "' + q.value.trim() + '"'
        : total + ' emoji, grouped';
    }

    document.body.addEventListener('click', function (e) {
      var b = e.target.closest('.ebtn');
      if (!b) return;
      CT.copy(b.dataset.e);
      pushRecent(b.dataset.e);
    });

    q.addEventListener('input', search);
    drawRecent();
    search();
  })();

</html>
