<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackboard — Cja's Tools</title>
<meta name="description" content="A chalkboard you can write and draw on with a mouse, finger or stylus, then save as a picture. Works offline.">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .board-wrap {
    border: 10px solid #6b4a2b; border-radius: 10px;
    background: #2f4f43; overflow: hidden; line-height: 0;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.35);
  }
  #board { width: 100%; height: auto; display: block; touch-action: none; cursor: crosshair; }
  .swatches { display: flex; gap: 7px; flex-wrap: wrap; }
  .sw {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; padding: 0;
  }
  .sw.on { border-color: var(--accent); }
  .sizes { display: flex; gap: 7px; align-items: center; }
</style>
</head>
<body data-page="tool" data-slug="blackboard">

  <div class="shell">
    <main>
      <div class="crumb">
        <a href="../index.html">All tools</a> &rsaquo;
        <a href="../index.html?cat=text">Text</a>
      </div>

      <div class="tool-head">
        <h1>Blackboard</h1>
        <p>Write with a mouse, a finger or a stylus. Nothing is uploaded.</p>
      </div>

      <div class="panel">
        <div class="board-wrap">
          <canvas id="board" width="1200" height="750"></canvas>
        </div>
      </div>

      <div class="panel">
        <div class="field">
          <label>Chalk colour</label>
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="field">
          <label for="size">Thickness: <span id="size-val">4</span></label>
          <input type="range" id="size" min="1" max="40" value="4" style="width:100%">
        </div>
        <div class="btns">
          <button class="btn" id="eraser">Eraser</button>
          <button class="btn" id="undo">Undo</button>
          <button class="btn" id="clear">Clear the board</button>
          <button class="btn primary" id="save">Save as picture</button>
        </div>
        <p class="hint">Undo goes back up to 20 strokes. Clearing cannot be undone.</p>
      </div>
    </main>
  </div>

  <script src="../assets/tools.js"></script>
  <script src="../assets/app.js"></script>
  <script>
  (function () {
    var COLOURS = ['#f4f1e8', '#ffe9a8', '#a8e6cf', '#ffb3ba', '#bae1ff', '#e2c6ff'];
    var BOARD = '#2f4f43';

    var canvas = document.getElementById('board');
    var ctx = canvas.getContext('2d');
    var colour = COLOURS[0];
    var size = 4;
    var erasing = false;
    var drawing = false;
    var last = null;
    var history = [];

    function paintBoard() {
      ctx.fillStyle = BOARD;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function snapshot() {
      /* Keeping full frames is simple and fast enough at this size. Older
         ones are dropped so memory does not grow without limit. */
      history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      if (history.length > 20) history.shift();
    }

    /* The canvas is a fixed 1200x750 but is displayed at whatever width
       fits, so pointer coordinates have to be scaled or the line lands
       away from the cursor. */
    function pos(e) {
      var r = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - r.left) * (canvas.width / r.width),
        y: (e.clientY - r.top) * (canvas.height / r.height)
      };
    }

    function start(e) {
      e.preventDefault();
      snapshot();
      drawing = true;
      last = pos(e);
      /* A single tap should leave a dot, not nothing. */
      draw(e);
    }

    function draw(e) {
      if (!drawing) return;
      e.preventDefault();
      var p = pos(e);
      ctx.strokeStyle = erasing ? BOARD : colour;
      ctx.lineWidth = erasing ? size * 3 : size;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.globalAlpha = erasing ? 1 : 0.92;
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
      last = p;
    }

    function stop() { drawing = false; last = null; }

    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', draw);
    window.addEventListener('pointerup', stop);
    canvas.addEventListener('pointerleave', stop);

    document.getElementById('swatches').innerHTML = COLOURS.map(function (c, i) {
      return '<button class="sw' + (i === 0 ? ' on' : '') + '" data-c="' + c +
             '" style="background:' + c + '" title="' + c + '"></button>';
    }).join('');

    document.getElementById('swatches').addEventListener('click', function (e) {
      var b = e.target.closest('[data-c]');
      if (!b) return;
      colour = b.dataset.c;
      erasing = false;
      document.getElementById('eraser').classList.remove('primary');
      this.querySelectorAll('.sw').forEach(function (s) { s.classList.remove('on'); });
      b.classList.add('on');
    });

    document.getElementById('size').addEventListener('input', function () {
      size = +this.value;
      document.getElementById('size-val').textContent = size;
    });

    document.getElementById('eraser').addEventListener('click', function () {
      erasing = !erasing;
      this.classList.toggle('primary', erasing);
    });

    document.getElementById('undo').addEventListener('click', function () {
      if (!history.length) { CT.toast('Nothing to undo'); return; }
      ctx.putImageData(history.pop(), 0, 0);
    });

    document.getElementById('clear').addEventListener('click', function () {
      if (!window.confirm('Clear the whole board? This cannot be undone.')) return;
      history = [];
      paintBoard();
    });

    document.getElementById('save').addEventListener('click', function () {
      var a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'blackboard.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    paintBoard();
  })();
  </script>
</body>
</html>
