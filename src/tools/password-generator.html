<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Generator — Cja's Tools</title>
<meta name="description" content="Generate strong random passwords on your own device. Nothing is sent over the internet. Free and works offline.">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-page="tool" data-slug="password-generator">

  <div class="shell">
    <main>
      <div class="crumb">
        <a href="../index.html">All tools</a> &rsaquo;
        <a href="../index.html?cat=security">Security</a>
      </div>

      <div class="tool-head">
        <h1>Password Generator</h1>
        <p>Made on your device using your browser's secure randomness. Nothing is sent anywhere.</p>
      </div>

      <div class="panel">
        <div class="field">
          <label for="out">Your password</label>
          <input type="text" id="out" readonly spellcheck="false" autocomplete="off">
        </div>
        <div class="btns">
          <button class="btn primary" id="copy">Copy</button>
          <button class="btn" id="again">Generate another</button>
        </div>
        <div class="result" id="strength" style="margin-top:14px">&mdash;</div>
      </div>

      <div class="panel">
        <div class="field">
          <label for="len">Length: <span id="len-val">16</span> characters</label>
          <input type="range" id="len" min="4" max="64" value="16" style="width:100%">
        </div>

        <div class="field">
          <label>Include</label>
          <div class="btns" id="sets">
            <button class="btn primary" data-set="lower">abc</button>
            <button class="btn primary" data-set="upper">ABC</button>
            <button class="btn primary" data-set="digit">123</button>
            <button class="btn primary" data-set="symbol">!@#</button>
          </div>
        </div>

        <div class="field">
          <label>
            <input type="checkbox" id="no-ambig" style="width:auto;margin-right:7px">
            Leave out lookalike characters (0 O l 1 I)
          </label>
        </div>

        <p class="hint">A 16-character password with all four types would take
          essentially forever to guess. Longer beats more complicated.</p>
      </div>
    </main>
  </div>

  <script src="../assets/tools.js"></script>
  <script src="../assets/app.js"></script>
  <script>
  (function () {
    var SETS = {
      lower:  'abcdefghijklmnopqrstuvwxyz',
      upper:  'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      digit:  '0123456789',
      symbol: '!@#$%^&*()-_=+[]{};:,.?/'
    };
    var AMBIGUOUS = '0Ol1I';

    var on = { lower: true, upper: true, digit: true, symbol: true };

    var out = document.getElementById('out');
    var len = document.getElementById('len');
    var lenVal = document.getElementById('len-val');
    var noAmbig = document.getElementById('no-ambig');

    /* Math.random() is not safe for passwords. crypto.getRandomValues is.
       The rejection loop below stops the modulo bias that would otherwise
       make early characters in the pool slightly more likely. */
    function randomIndex(max) {
      var limit = Math.floor(0xFFFFFFFF / max) * max;
      var buf = new Uint32Array(1);
      var n;
      do {
        crypto.getRandomValues(buf);
        n = buf[0];
      } while (n >= limit);
      return n % max;
    }

    function pool() {
      var chars = '';
      Object.keys(SETS).forEach(function (k) {
        if (on[k]) chars += SETS[k];
      });
      if (noAmbig.checked) {
        chars = chars.split('').filter(function (c) {
          return AMBIGUOUS.indexOf(c) === -1;
        }).join('');
      }
      return chars;
    }

    function generate() {
      var chars = pool();
      var n = parseInt(len.value, 10);

      if (!chars.length) {
        out.value = '';
        document.getElementById('strength').innerHTML =
          '&mdash;<small>Choose at least one type of character</small>';
        return;
      }

      var pw = '';
      for (var i = 0; i < n; i++) pw += chars.charAt(randomIndex(chars.length));

      /* Guarantee every chosen type actually appears — otherwise a short
         password can come out with no digit purely by chance. */
      var chosen = Object.keys(SETS).filter(function (k) { return on[k]; });
      if (n >= chosen.length) {
        var positions = [];
        while (positions.length < chosen.length) {
          var p = randomIndex(n);
          if (positions.indexOf(p) === -1) positions.push(p);
        }
        chosen.forEach(function (k, i) {
          var set = SETS[k];
          if (noAmbig.checked) {
            set = set.split('').filter(function (c) {
              return AMBIGUOUS.indexOf(c) === -1;
            }).join('');
          }
          if (!set.length) return;
          var arr = pw.split('');
          arr[positions[i]] = set.charAt(randomIndex(set.length));
          pw = arr.join('');
        });
      }

      out.value = pw;
      showStrength(pw.length, chars.length);
    }

    function showStrength(length, poolSize) {
      var bits = length * Math.log2(poolSize);
      var label, note;
      if (bits < 40)       { label = 'Weak';        note = 'Fine for something throwaway only'; }
      else if (bits < 60)  { label = 'Reasonable';  note = 'Acceptable for low-value accounts'; }
      else if (bits < 80)  { label = 'Strong';      note = 'Good for everyday accounts'; }
      else                 { label = 'Very strong'; note = 'Suitable for banking and email'; }

      document.getElementById('strength').innerHTML =
        label + '<small>' + Math.round(bits) + ' bits of randomness — ' + note + '</small>';
    }

    document.getElementById('sets').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-set]');
      if (!btn) return;
      var k = btn.dataset.set;
      /* Never let the last type be switched off. */
      if (on[k] && Object.keys(on).filter(function (x) { return on[x]; }).length === 1) {
        CT.toast('Keep at least one type');
        return;
      }
      on[k] = !on[k];
      btn.classList.toggle('primary', on[k]);
      generate();
    });

    len.addEventListener('input', function () {
      lenVal.textContent = len.value;
      generate();
    });

    noAmbig.addEventListener('change', generate);
    document.getElementById('again').addEventListener('click', generate);

    document.getElementById('copy').addEventListener('click', function () {
      if (!out.value) { CT.toast('Nothing to copy'); return; }
      CT.copy(out.value);
    });

    generate();
  })();
  </script>
</body>
</html>
