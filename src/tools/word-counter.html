<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Counter — Cja's Tools</title>
<meta name="description" content="Count words, characters, sentences, paragraphs and reading time as you type. Free and works offline.">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body data-page="tool" data-slug="word-counter">

  <div class="shell">
    <main>
      <div class="crumb">
        <a href="../index.html">All tools</a> &rsaquo;
        <a href="../index.html?cat=text">Text</a>
      </div>

      <div class="tool-head">
        <h1>Word Counter</h1>
        <p>Counts update as you type. Your text stays on this device.</p>
      </div>

      <div class="panel">
        <div class="stats" id="stats">
          <div class="stat"><b id="s-words">0</b><span>Words</span></div>
          <div class="stat"><b id="s-chars">0</b><span>Characters</span></div>
          <div class="stat"><b id="s-nospace">0</b><span>No spaces</span></div>
          <div class="stat"><b id="s-sentences">0</b><span>Sentences</span></div>
          <div class="stat"><b id="s-paras">0</b><span>Paragraphs</span></div>
          <div class="stat"><b id="s-read">0s</b><span>Reading time</span></div>
        </div>
      </div>

      <div class="panel">
        <div class="field">
          <label for="text">Your text</label>
          <textarea id="text" placeholder="Type or paste your text here&hellip;" spellcheck="false"></textarea>
        </div>
        <div class="btns">
          <button class="btn" id="paste">Paste</button>
          <button class="btn" id="clear">Clear</button>
        </div>
        <p class="hint">Reading time assumes 200 words a minute, an average adult pace.</p>
      </div>
    </main>
  </div>

  <script src="../assets/tools.js"></script>
  <script src="../assets/app.js"></script>
  <script>
  (function () {
    var ta = document.getElementById('text');

    function readingTime(words) {
      var seconds = Math.round(words / 200 * 60);
      if (seconds < 60) return seconds + 's';
      var m = Math.floor(seconds / 60);
      var s = seconds % 60;
      return s ? m + 'm ' + s + 's' : m + 'm';
    }

    function count() {
      var t = ta.value;

      var words = t.trim() ? t.trim().split(/\s+/).length : 0;
      var chars = t.length;
      var noSpace = t.replace(/\s/g, '').length;

      /* A sentence ends at . ! ? — but not on "Mr." style dots with no gap after. */
      var sentences = (t.match(/[^\s.!?][^.!?]*[.!?]+(\s|$)/g) || []).length;
      if (!sentences && t.trim()) sentences = 1;

      var paras = t.trim() ? t.trim().split(/\n\s*\n/).filter(function (p) {
        return p.trim().length;
      }).length : 0;

      document.getElementById('s-words').textContent = words.toLocaleString();
      document.getElementById('s-chars').textContent = chars.toLocaleString();
      document.getElementById('s-nospace').textContent = noSpace.toLocaleString();
      document.getElementById('s-sentences').textContent = sentences.toLocaleString();
      document.getElementById('s-paras').textContent = paras.toLocaleString();
      document.getElementById('s-read').textContent = readingTime(words);
    }

    ta.addEventListener('input', count);

    document.getElementById('clear').addEventListener('click', function () {
      ta.value = '';
      count();
      ta.focus();
    });

    document.getElementById('paste').addEventListener('click', function () {
      if (!navigator.clipboard || !navigator.clipboard.readText) {
        CT.toast('Use Ctrl+V instead');
        ta.focus();
        return;
      }
      navigator.clipboard.readText().then(function (txt) {
        ta.value = txt;
        count();
      }, function () {
        CT.toast('Use Ctrl+V instead');
        ta.focus();
      });
    });

    count();
  })();
  </script>
</body>
</html>
